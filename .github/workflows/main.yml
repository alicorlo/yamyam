
name: VPS SSH Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  connect-to-vps:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          echo "SSH configuration completed."

      - name: Connect to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'

          echo "================================"
          echo "       VPS CONNECTED"
          echo "================================"

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "System uptime:"
          uptime

          echo ""
          echo "Disk usage:"
          df -h

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Current user:"
          whoami

          echo ""
          echo "SSH connection successful!"

          REMOTE
